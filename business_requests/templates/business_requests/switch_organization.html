{% extends "main/base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Switch Organization</h2>

    <p>
        Select the organization you want to administer.
    </p>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="organization_id">
                Organization
            </label>

            <select
                name="organization_id"
                id="organization_id"
                class="form-control"
                required
            >
                {% for organization in organizations %}
                    <option
                        value="{{ organization.id }}"
                        {% if current_organization and organization.id == current_organization.id %}
                            selected
                        {% endif %}
                    >
                        {{ organization.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button
            type="submit"
            class="btn btn-primary"
        >
            Switch Organization
        </button>

    </form>

    {% if current_organization %}
        <p class="mt-3">
            Currently administering:
            <strong>{{ current_organization.name }}</strong>
        </p>
    {% endif %}

</div>

{% endblock %}
